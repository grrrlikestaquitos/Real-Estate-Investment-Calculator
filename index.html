<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#282c34" />
    <meta
      name="description"
      content="BRRR real estate investment calculator: 2% rule, cash flow, ROI, appreciation, and mortgage/points analysis."
    />
    <link rel="manifest" href="/manifest.json" />
    <title>Real Estate Investment Calculator</title>
    <script>
      // Apply the saved (or OS) theme before first paint to avoid a flash; see src/hooks/useTheme.ts.
      try {
        var theme = localStorage.getItem('brrr-calculator/theme')
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
